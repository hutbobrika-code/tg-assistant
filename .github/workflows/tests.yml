name: Тесты

on:
  push:
    paths: ["**.py", "deploy/**"]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Утилиты для схем
        run: sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin
      - name: Запуск тестов
        run: |
          cd tests
          python3 -m unittest discover -v
