name: Бот

# job в actions живёт максимум 6 часов, поэтому смена 5 часов, потом сохраняем
# историю и запускаем следующую. cron на случай если цепочка оборвётся

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: assistant-bot
  cancel-in-progress: false

jobs:
  shift:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      ENABLED: ${{ secrets.TG_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.ENABLED == 'true'

      - name: Установка Python
        if: env.ENABLED == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Утилиты для схем
        if: env.ENABLED == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin

      - name: Расшифровка состояния
        if: env.ENABLED == 'true'
        env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
        run: |
          if [ -n "$STATE_KEY" ] && [ -f state/state.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 -salt -pass env:STATE_KEY -in state/state.enc -out state.json || true
          fi
          mkdir -p data
          if [ -n "$STATE_KEY" ] && [ -f state/gemini.db.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 -salt -pass env:STATE_KEY -in state/gemini.db.enc -out data/gemini.db || true
          fi

      - name: Запуск Gemini Web2API роутера
        if: env.ENABLED == 'true'
        run: |
          curl -fsSL -o gemini-web2api-go https://github.com/zexadev/gemini-web2api-go/releases/download/v4.22.0/gemini-web2api-go_v4.22.0_linux_amd64
          chmod +x gemini-web2api-go
          ./gemini-web2api-go --port 8083 --api-key sk-gemini-internal --db data/gemini.db &
          timeout 30 bash -c 'until curl -s http://127.0.0.1:8083/ >/dev/null; do sleep 1; done'
          echo "Gemini Web2API ready on :8083!"

      - name: Смена
        if: env.ENABLED == 'true'
        run: |
          echo "STARTED=$(date +%s)" >> "$GITHUB_ENV"
          python3 bot.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          ALLOWED_USERS: ${{ secrets.ALLOWED_USERS }}
          ALLOWED_IDS: "8693081862"
          SHIFT_MINUTES: "300"
          OC_WORKDIR: "workspace"
          GEMINI_URL: "http://127.0.0.1:8083/v1"
          GEMINI_API_KEY: "sk-gemini-internal"
          STATE_KEY: ${{ secrets.STATE_KEY }}

      - name: Сохранить историю
        if: always() && env.ENABLED == 'true'
        env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
        run: |
          kill -TERM $(pgrep gemini-web2api-go) 2>/dev/null || true
          sleep 2
          sqlite3 data/gemini.db "PRAGMA wal_checkpoint(TRUNCATE);" 2>/dev/null || true
          mkdir -p state
          if [ -f state.json ] && [ -n "$STATE_KEY" ]; then
            openssl enc -aes-256-cbc -pbkdf2 -iter 100000 -salt -pass env:STATE_KEY -in state.json -out state/state.enc
          fi
          if [ -f data/gemini.db ] && [ -n "$STATE_KEY" ]; then
            openssl enc -aes-256-cbc -pbkdf2 -iter 100000 -salt -pass env:STATE_KEY -in data/gemini.db -out state/gemini.db.enc
          fi
          git config user.name "assistant-bot"
          git config user.email "assistant-bot@users.noreply.github.com"
          git add state/
          git diff --staged --quiet || (git commit -m "история и сессии $(date -u '+%F %H:%M UTC')" && git pull --rebase && git push)

      - name: Следующая смена
        if: always() && env.ENABLED == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ $(( $(date +%s) - ${STARTED:-0} )) -lt 600 ]; then
            echo "смена продержалась меньше 10 минут, жду cron"
            exit 0
          fi
          gh workflow run bot.yml --ref main
